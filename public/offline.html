<!doctype html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1d36">
<title>Kaafiye</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(135deg,#061427,#102a4c 55%,#065f46);color:#0f1b2d}
  .c{background:#fff;border-radius:20px;padding:28px;max-width:420px;width:100%;box-shadow:0 18px 48px -12px rgba(6,20,39,.35)}
  .b{font-weight:800;letter-spacing:.14em;color:#0a1d36;font-size:14px}
  h1{margin:14px 0 6px;font-size:22px}
  p{color:#64748b;margin:0 0 20px}
  button{width:100%;height:48px;border:0;border-radius:12px;background:#059669;color:#fff;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="c">
  <div class="b">KAAFIYE</div>
  <h1 id="t">Internet ma jiro</h1>
  <p id="p">Xogta lama kaydin karo adigoo aan internet haysan. Marka uu soo laabto, mar kale isku day.</p>
  <button id="r" onclick="location.reload()">Isku day mar kale</button>
</div>
<script>
  try {
    if (localStorage.getItem("kaafiye_lang") === "en") {
      document.documentElement.lang = "en";
      document.getElementById("t").textContent = "You are offline";
      document.getElementById("p").textContent = "Nothing can be saved while offline. Reconnect and try again.";
      document.getElementById("r").textContent = "Try again";
    }
  } catch (e) {}
</script>
</body>
</html>
